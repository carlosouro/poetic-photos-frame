<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poetic Memories</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23111'/><circle cx='16' cy='16' r='8' fill='%23f5af19'/></svg>">
    <link rel="stylesheet" href="/css/fonts.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="hide-cursor">

    <div id="app">
        <div id="loader-overlay" class="visible" aria-live="polite">
            <div id="loader-text">Loading Memories...</div>
        </div>

        <div id="photo-container">
            <div class="media-layer" id="layer-0">
                <canvas class="layer-video-backdrop" width="64" height="40" aria-hidden="true"></canvas>
                <img class="layer-photo" alt="Memory" decoding="async">
                <video class="layer-video" playsinline muted></video>
            </div>
            <div class="media-layer" id="layer-1">
                <canvas class="layer-video-backdrop" width="64" height="40" aria-hidden="true"></canvas>
                <img class="layer-photo" alt="Memory" decoding="async">
                <video class="layer-video" playsinline muted></video>
            </div>
        </div>

        <div id="text-overlay">
            <div id="content-wrapper">
                <div id="poem-text"></div>
                <div id="author-text"></div>
            </div>
            <div id="video-indicator">
                <span id="video-status-icon">▶</span>
                <span id="video-time-text">0:00 / 0:00</span>
            </div>
            <div id="date-display"></div>
        </div>

        <div id="weather-widget">
            <div class="weather-col" id="weather-slot-a">
                <div class="weather-header">
                    <span class="weather-time" id="weather-time-a">8am</span>
                    <span class="weather-day" id="weather-day-a">--</span>
                </div>
                <div class="weather-icon" id="weather-icon-a"></div>
                <div class="weather-temp" id="weather-temp-a">--</div>
            </div>
            <div class="weather-divider"></div>
            <div class="weather-col" id="weather-slot-b">
                <div class="weather-header">
                    <span class="weather-time" id="weather-time-b">4pm</span>
                    <span class="weather-day" id="weather-day-b">--</span>
                </div>
                <div class="weather-icon" id="weather-icon-b"></div>
                <div class="weather-temp" id="weather-temp-b">--</div>
            </div>
        </div>

        <button id="quick-fav" type="button" aria-label="Toggle favorite">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path class="heart-outline" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                <path class="heart-fill" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </button>

        <!-- Subtle touch feedback indicators -->
        <div id="tap-feedback-left" class="tap-feedback tap-left" aria-hidden="true">‹</div>
        <div id="tap-feedback-right" class="tap-feedback tap-right" aria-hidden="true">›</div>

        <!-- 3-zone touch navigation -->
        <div id="zone-left" class="click-zone"></div>
        <div id="zone-center" class="click-zone"></div>
        <div id="zone-right" class="click-zone"></div>

        <!-- Control Panel Modal -->
        <dialog id="menu-dialog" class="kiosk-dialog" closedby="any" aria-labelledby="menu-dialog-title">
            <div class="dialog-card">
                <h2 id="menu-dialog-title" class="dialog-title">Control Panel</h2>

                <div id="rotate-group" class="btn-row">
                    <button type="button" id="btn-rotate-left" class="btn btn-secondary">
                        <span class="btn-icon" aria-hidden="true">↺</span> Rotate Left
                    </button>
                    <button type="button" id="btn-rotate-right" class="btn btn-secondary">
                        <span class="btn-icon" aria-hidden="true">↻</span> Rotate Right
                    </button>
                </div>

                <button type="button" id="btn-omit" class="btn btn-omit">
                    <span class="btn-icon" aria-hidden="true">🚫</span> Omit Photo
                </button>

                <button type="button" id="btn-delete" class="btn btn-danger">
                    <span class="btn-icon" aria-hidden="true">🗑️</span> Delete Photo
                </button>

                <div class="dialog-divider"></div>

                <div class="btn-row">
                    <button type="button" id="btn-reload" class="btn btn-subtle">
                        <span class="btn-icon" aria-hidden="true">↻</span> Reload
                    </button>
                    <button type="button" id="btn-reboot" class="btn btn-subtle">
                        <span class="btn-icon" aria-hidden="true">🔄</span> Restart
                    </button>
                    <button type="button" id="btn-exit" class="btn btn-danger-outline">
                        <span class="btn-icon" aria-hidden="true">⏻</span> Exit
                    </button>
                </div>

                <form method="dialog" class="dialog-close-form">
                    <button type="submit" value="close" class="btn btn-close" autofocus>Close</button>
                </form>

                <div id="status-footer" class="status-footer">Checking library status...</div>
            </div>
        </dialog>

        <!-- Delete Confirmation Modal -->
        <dialog id="delete-dialog" class="kiosk-dialog" aria-labelledby="delete-dialog-title">
            <div class="dialog-card">
                <h2 id="delete-dialog-title" class="dialog-title dialog-title-danger">Delete Memory?</h2>
                <p class="dialog-message">This permanently deletes the file from your NAS and cannot be undone.</p>
                <img id="delete-preview-img" alt="Preview of memory to delete">
                <video id="delete-preview-video" playsinline muted></video>
                <form method="dialog" class="btn-row">
                    <button type="submit" value="cancel" class="btn btn-cancel" autofocus>Cancel</button>
                    <button type="submit" value="confirm" class="btn btn-danger">Confirm Delete</button>
                </form>
            </div>
        </dialog>

        <!-- Generic Action Confirmation Modal (Restart / Exit) -->
        <dialog id="confirm-dialog" class="kiosk-dialog" aria-labelledby="confirm-dialog-title">
            <div class="dialog-card">
                <h2 id="confirm-dialog-title" class="dialog-title">Confirm Action</h2>
                <p id="confirm-dialog-message" class="dialog-message"></p>
                <form method="dialog" class="btn-row">
                    <button type="submit" value="cancel" class="btn btn-cancel" autofocus>Cancel</button>
                    <button type="submit" id="confirm-dialog-accept" value="confirm" class="btn btn-danger">Confirm</button>
                </form>
            </div>
        </dialog>

        <!-- Non-blocking Toast Notification Region -->
        <div id="toast-region" role="region" aria-label="Notifications">
            <div id="toast" popover="manual" class="toast">
                <span id="toast-message"></span>
                <button type="button" id="toast-dismiss" class="toast-dismiss" popovertarget="toast" popovertargetaction="hide" aria-label="Dismiss notification">×</button>
            </div>
        </div>
        <div id="sr-announcements" class="visually-hidden" aria-live="polite"></div>
    </div>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
